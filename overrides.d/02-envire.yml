---
# Envire-related overrides.
- envire/envire_visualizer:
  # qt5fix: replace QAction::activated (removed in Qt5) with QAction::triggered.
  # vertex_missing_fix: guard tree.at() calls with vertex_not_found bool to prevent
  # std::out_of_range crash when a frame is in the graph but not in the spanning tree.
  branch: vertex_missing_fix
- tools/smurf:
  # Branch 22.04 adds default constructors required by ENVIRE_REGISTER_ITEM/
  # BOOST_CLASS_EXPORT, and uses base::Pose for Collidable/Visual origins
  # (compatible with Ubuntu 22.04+).
  branch: "22.04"
