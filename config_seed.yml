---
prefer_indep_over_os_packages: false
osdeps_mode: all
apt_dpkg_update: true
GITHUB: http
GITHUB_ROOT: https://github.com
GITHUB_PUSH_ROOT: "https://github.com"
SPACEGIT: http
SPACEGIT_ROOT: https://git.hb.dfki.de
SPACEGIT_PUSH_ROOT: https://git.hb.dfki.de
DFKIGIT: http
DFKIGIT_ROOT: https://git.hb.dfki.de
DFKIGIT_PUSH_ROOT: https://git.hb.dfki.de
GITLAB: http,ssh
GITLAB_ROOT: https://gitlab.com
GITLAB_PUSH_ROOT: 'git@gitlab.com:'
GITLAB_PRIVATE_ROOT: 'git@gitlab.com:'
ROCK_SELECTED_FLAVOR: master
ROCK_FLAVOR: master
ROCK_BRANCH: master
typelib_cxx_loader: castxml
USE_PYTHON: true
USE_OCL: false
rtt_target: gnulinux
rtt_corba_implementation: omniorb
NDLCOM_ROBOTCONFIG: Coyote3Config
use_default_config: true
textlog: false
